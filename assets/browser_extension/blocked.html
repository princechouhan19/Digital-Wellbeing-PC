<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paused by Digital Wellbeing</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101014;
      --text: #f5f5f7;
      --sub: #9ca3af;
      --border: rgba(255,255,255,.10);
      --accent-emerald: #10b981;
      --accent-indigo: #6366f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 15%, #182232 0%, var(--bg) 70%);
      color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; user-select: none;
    }
    .card {
      max-width: 500px; width: 100%; text-align: center;
      background: rgba(28, 29, 36, 0.85); border: 1px solid var(--border);
      border-radius: 24px; padding: 44px 32px; backdrop-filter: blur(28px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    /* Mindful Breathing Circle */
    .breathe-container {
      width: 80px; height: 80px; margin: 0 auto 24px; position: relative;
      display: grid; place-items: center;
    }
    .breathe-ring {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.3);
      animation: pulse 6s ease-in-out infinite;
    }
    .breathe-core {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      display: grid; place-items: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
    .breathe-core img {
      width: 26px; height: 26px; object-fit: contain; display: block;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 0.9; border-color: rgba(16, 185, 129, 0.7); }
    }
    h1 { font-size: 24px; letter-spacing: -.5px; margin: 0 0 8px; font-weight: 700; }
    p.lead { color: var(--sub); margin: 0 0 16px; font-size: 14px; }
    .reason-box {
      display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 16px;
      padding: 8px 16px; border-radius: 12px; background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28); color: #fbbf24; font-size: 13px; font-weight: 600;
    }
    .url {
      font-size: 12px; color: #6b7280; font-family: monospace; word-break: break-all;
      margin-bottom: 24px; max-height: 48px; overflow: hidden; text-overflow: ellipsis;
    }
    .action-row {
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    button {
      background: #10b981; color: white; border: 0; border-radius: 999px;
      padding: 11px 26px; font-weight: 700; font-size: 13px; cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: #059669; }
    button.secondary { background: rgba(255,255,255,.08); color: var(--text); }
    button.secondary:hover { background: rgba(255,255,255,.14); }
    button.breathe-btn { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
    button.breathe-btn:hover { background: rgba(99, 102, 241, 0.25); }
    .breather-timer {
      display: none; margin-top: 18px; font-size: 13px; color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="breathe-container">
      <div class="breathe-ring"></div>
      <div class="breathe-core">
        <img src="icons/icon-48.png" width="26" height="26" alt="Digital Wellbeing" />
      </div>
    </div>
    <h1>Pause & Take a Breath</h1>
    <p class="lead">You are currently in a Focus session. This sub-path is on your distraction list.</p>
    <div id="reason" class="reason-box">Blocked by Focus rules</div>
    <div id="url" class="url"></div>
    <div class="action-row">
      <button id="close">Close Tab</button>
      <button id="back" class="secondary">Go Back</button>
      <button id="breatheBtn" class="breathe-btn">60s Mindfulness</button>
    </div>
    <div id="breatherTimer" class="breather-timer">Take slow, calming breaths... <span id="countdown">60</span>s</div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
