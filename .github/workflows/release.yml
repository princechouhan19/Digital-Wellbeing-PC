name: Build Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate tag matches version.json
        shell: pwsh
        run: |
          $appVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -match "^v(.+)$") {
            $tagVersion = $matches[1]
            if ($tagVersion -ne $appVersion) {
              Write-Error "Tag v$tagVersion does not match version.json v$appVersion"
              exit 1
            }
          }
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV

      - name: Prepare optional signing certificate
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ($env:CERT_B64) {
            [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_B64))
            Write-Host "Signing certificate prepared."
          } else {
            Write-Host "No signing certificate configured; artifacts will be unsigned."
          }

      - name: Sync resource versions
        shell: pwsh
        run: |
          python -c "import build; build.update_file_version_info('$env:APP_VERSION'); build.update_manifest_version('$env:APP_VERSION')"

      - name: Build app, uninstaller, and setup
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: ./installer/build_installer.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digital-wellbeing-windows
          path: |
            dist/DigitalWellbeingSetup-*.exe
            dist/Uninstall Digital Wellbeing.exe
            dist/DigitalWellbeing-v*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DigitalWellbeingSetup-*.exe
            dist/Uninstall Digital Wellbeing.exe
            dist/DigitalWellbeing-v*.zip
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
